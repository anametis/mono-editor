worker_processes auto;
events { worker_connections 2048; }
http {
 include /etc/nginx/mime.types;
 proxy_cache_path /var/cache/nginx/kara levels=1:2 keys_zone=public_html:20m max_size=1g inactive=10m;
 map $http_cookie $has_cookie { default 1; "" 0; }
 map $http_authorization $has_auth { default 1; "" 0; }
 map $request_method $not_get { default 1; GET 0; }
 map $http_accept $not_html { default 1; ~*text/html 0; }
 map "$http_rsc$http_next_router_state_tree$http_next_router_prefetch$http_next_url" $is_rsc { default 1; "" 0; }
 map $args $has_query { default 1; "" 0; }
 map $upstream_status $not_ok { default 1; 200 0; }
 map $upstream_http_content_type $not_html_response { default 1; ~*^text/html 0; }
 limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
 upstream api { server api:4000; }
 upstream web { server web:3000; }
 server {
  listen 8080;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location /api/ { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
  location ~ ^/(?:posts/[a-z0-9]+(?:-[a-z0-9]+)*)?$ {
   proxy_pass http://web;
   proxy_set_header Host $host;
   proxy_cache public_html;
   proxy_cache_key "$host$request_uri";
   proxy_cache_methods GET;
   proxy_cache_valid 200 60s;
   proxy_cache_lock on;
   proxy_cache_use_stale off;
   proxy_cache_background_update off;
   proxy_cache_revalidate off;
   proxy_cache_bypass $has_cookie $has_auth $not_get $not_html $is_rsc $has_query;
   proxy_no_cache $has_cookie $has_auth $not_get $not_html $is_rsc $has_query $not_ok $not_html_response $upstream_http_set_cookie;
   # Only these explicitly public routes override Next's no-store. Vary and Set-Cookie remain honored.
   proxy_ignore_headers Cache-Control Expires;
   proxy_hide_header Cache-Control;
   add_header Cache-Control "private, no-store" always;
   add_header X-Cache $upstream_cache_status always;
  }
  location /_next/static/ { proxy_pass http://web; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { proxy_pass http://web; proxy_set_header Host $host; }
 }
 server {
  listen 8081;
  server_name _;
  root /srv/admin;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location /api/ { limit_req zone=api_limit burst=40 nodelay; proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
 }
}
